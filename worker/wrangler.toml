name = "lexiscene-worker"
main = "src/index.ts"
compatibility_date = "2024-06-20"
workers_dev = true
keep_vars = true
preview_urls = false

[vars]
EMAIL_FROM = "LexiScene <onboarding@resend.dev>"
FRONTEND_ORIGIN = "https://www.lexiscene.online"
# 非敏感默认可在 wrangler.toml 中
# 敏感 key（模型、Turnstile、Resend）通过 .dev.vars 或 Cloudflare dashboard 配置

# 创建 D1 后取消注释，并填入 wrangler 返回的 database_id：
[[d1_databases]]
binding = "DB"
database_name = "lexiscene"
database_id = "5ee7a76f-42e0-479d-909a-21ffa41b58f1"
migrations_dir = "migrations"

[triggers]
# Cloudflare Cron uses UTC. 23:00 UTC is 07:00 in Asia/Shanghai.
crons = ["0 23 * * *"]

# 限流用 KV
# [[kv_namespaces]]
# binding = "RL"
# id = "YOUR_KV_NAMESPACE_ID"
